<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" fill="none">
  <title>Vector Lab: a manifold rendered as a wireframe field</title>
  <defs>
    <radialGradient id="vignette" cx="50%" cy="55%" r="65%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.65"/>
    </radialGradient>
  </defs>

  <!-- Subtle background grid -->
  <g stroke="#e8eaf0" stroke-width="0.5">
    <path d="M 0 50 H 800 M 0 100 H 800 M 0 150 H 800 M 0 200 H 800 M 0 250 H 800 M 0 300 H 800 M 0 350 H 800"/>
    <path d="M 50 0 V 400 M 100 0 V 400 M 150 0 V 400 M 200 0 V 400 M 250 0 V 400 M 300 0 V 400 M 350 0 V 400 M 400 0 V 400 M 450 0 V 400 M 500 0 V 400 M 550 0 V 400 M 600 0 V 400 M 650 0 V 400 M 700 0 V 400 M 750 0 V 400"/>
  </g>

  <!-- Warped manifold (central) -->
  <g stroke="#0a1f44" stroke-width="1.2" fill="none" stroke-linecap="round" opacity="0.95">
    <!-- Horizontal wires (latitude) -->
    <path d="M 140 110 C 320 70, 480 70, 660 110"/>
    <path d="M 130 150 C 320 110, 480 110, 670 150"/>
    <path d="M 120 195 C 320 155, 480 155, 680 195"/>
    <path d="M 120 245 C 320 285, 480 285, 680 245"/>
    <path d="M 130 290 C 320 330, 480 330, 670 290"/>
    <path d="M 140 330 C 320 370, 480 370, 660 330"/>
    <!-- Vertical wires (longitude) -->
    <path d="M 220 90 C 180 200, 180 200, 220 350"/>
    <path d="M 310 80 C 260 200, 260 200, 310 360"/>
    <path d="M 400 75 C 360 200, 360 200, 400 365"/>
    <path d="M 490 80 C 540 200, 540 200, 490 360"/>
    <path d="M 580 90 C 620 200, 620 200, 580 350"/>
  </g>

  <!-- Axes through origin -->
  <g stroke="#7a2e2e" stroke-width="0.75" stroke-opacity="0.5">
    <line x1="80" y1="200" x2="720" y2="200"/>
    <line x1="400" y1="50" x2="400" y2="350"/>
  </g>

  <!-- Sampled points on the manifold -->
  <g fill="#1a1a1a" opacity="0.85">
    <circle cx="240" cy="135" r="2"/>
    <circle cx="320" cy="118" r="2"/>
    <circle cx="400" cy="113" r="2.5"/>
    <circle cx="480" cy="123" r="2"/>
    <circle cx="560" cy="148" r="2"/>
    <circle cx="210" cy="200" r="2"/>
    <circle cx="295" cy="190" r="2"/>
    <circle cx="400" cy="200" r="3" fill="#0a1f44"/>
    <circle cx="505" cy="200" r="2"/>
    <circle cx="590" cy="205" r="2"/>
    <circle cx="240" cy="265" r="2"/>
    <circle cx="325" cy="275" r="2"/>
    <circle cx="405" cy="287" r="2.5"/>
    <circle cx="490" cy="277" r="2"/>
    <circle cx="565" cy="255" r="2"/>
    <circle cx="160" cy="160" r="1.5"/>
    <circle cx="640" cy="170" r="1.5"/>
    <circle cx="170" cy="240" r="1.5"/>
    <circle cx="635" cy="245" r="1.5"/>
    <circle cx="380" cy="90" r="1.5"/>
    <circle cx="420" cy="345" r="1.5"/>
  </g>
</svg>
